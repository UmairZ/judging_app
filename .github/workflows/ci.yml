name: CI
on:
  pull_request:
  push:
    branches: [saas, main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4 # Firestore emulator for rules tests
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}
      - run: npm ci
      - run: npm run build --if-present # tsc typecheck + vite build
        env:
          VITE_USE_EMULATOR: '1' # build without real env files present in CI
      - run: npx vitest run
      - run: npm run test:rules
